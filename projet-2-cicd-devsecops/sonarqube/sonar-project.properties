# =============================================================================
# SonarQube Project Configuration
# =============================================================================
# This file configures the sonar-scanner for the Finance App project.
# Place at the root of the project or specify with -Dproject.settings=
# =============================================================================

# --- Project identification ---
sonar.projectKey=finance-app
sonar.projectName=Finance App - DevSecOps
sonar.projectVersion=1.0.0

# --- Source code configuration ---
sonar.sources=app/
sonar.tests=app/tests/
sonar.language=py
sonar.sourceEncoding=UTF-8

# --- Python coverage report (generated by pytest --cov) ---
sonar.python.coverage.reportPaths=app/coverage.xml

# --- Exclusions ---
# Files/directories to exclude from analysis
sonar.exclusions=\
  **/venv/**,\
  **/__pycache__/**,\
  **/migrations/**,\
  **/.git/**,\
  **/node_modules/**,\
  **/*.pyc

# Test file exclusions (not counted in coverage)
sonar.test.exclusions=\
  **/test_*.py,\
  **/tests/**

# --- Quality Gate ---
# Wait for the quality gate result (used in CI)
# sonar.qualitygate.wait=true
# sonar.qualitygate.timeout=300

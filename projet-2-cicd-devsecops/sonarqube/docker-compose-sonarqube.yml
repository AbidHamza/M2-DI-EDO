# =============================================================================
# Docker Compose — SonarQube + PostgreSQL
# =============================================================================
# SonarQube Community Edition for static code analysis
# PostgreSQL as the backing database
#
# Usage:
#   docker compose -f docker-compose-sonarqube.yml up -d
#   → SonarQube: http://localhost:9000 (admin/admin)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # SonarQube Server
  # ---------------------------------------------------------------------------
  sonarqube:
    image: sonarqube:10-community
    container_name: sonarqube
    hostname: sonarqube
    ports:
      - "9000:9000"
    environment:
      # Database connection
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: sonarqube_password
      # JVM settings
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - sonarqube-network
    depends_on:
      sonarqube-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/api/system/status | grep -q UP || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ---------------------------------------------------------------------------
  # PostgreSQL Database for SonarQube
  # ---------------------------------------------------------------------------
  sonarqube-db:
    image: postgres:16-alpine
    container_name: sonarqube-db
    hostname: sonarqube-db
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: sonarqube_password
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    networks:
      - sonarqube-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonarqube -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  sonarqube_data:
    driver: local
  sonarqube_extensions:
    driver: local
  sonarqube_logs:
    driver: local
  sonarqube_db_data:
    driver: local

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  sonarqube-network:
    driver: bridge
    name: sonarqube-network

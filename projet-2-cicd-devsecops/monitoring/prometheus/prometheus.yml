# =============================================================================
# Prometheus Configuration
# =============================================================================
# Scrape configuration for the Finance App and system metrics.
# =============================================================================

global:
  # How often to scrape targets (default: 1m)
  scrape_interval: 15s
  # How often to evaluate alerting rules
  evaluation_interval: 15s
  # Timeout for scraping a target
  scrape_timeout: 10s

# ---------------------------------------------------------------------------
# Alerting rules (optional — for advanced setup)
# ---------------------------------------------------------------------------
rule_files:
  # Uncomment to enable alert rules
  # - "alert_rules.yml"

# ---------------------------------------------------------------------------
# Scrape targets
# ---------------------------------------------------------------------------
scrape_configs:
  # --- Prometheus self-monitoring ---
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"

  # --- Finance App metrics ---
  # Scrapes the /metrics endpoint of our Flask application
  - job_name: "finance-app"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      # Dev environment
      - targets: ["host.docker.internal:5001"]
        labels:
          environment: "dev"
          service: "finance-app"
      # Staging environment
      - targets: ["host.docker.internal:5002"]
        labels:
          environment: "staging"
          service: "finance-app"
      # Production environment
      - targets: ["host.docker.internal:5000"]
        labels:
          environment: "prod"
          service: "finance-app"

  # --- Finance App health check ---
  # Monitors the /health endpoint for uptime tracking
  - job_name: "finance-app-health"
    metrics_path: "/health"
    scrape_interval: 30s
    static_configs:
      - targets: ["host.docker.internal:5000"]
        labels:
          service: "finance-app"
          check: "health"

  # --- Node Exporter (system metrics) ---
  # CPU, memory, disk, network metrics from the host
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "node-exporter"

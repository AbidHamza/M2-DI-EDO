# =============================================================================
# Ansible Inventory — Staging Environment
# =============================================================================
# Replace the IP address with your actual staging server
# =============================================================================

[app_servers]
staging-server-01 ansible_host=192.168.1.20 ansible_user=deploy

[app_servers:vars]
# Application settings
app_name=finance-app
app_image=finance-app:latest
app_port=5002
app_internal_port=5000
environment=staging
log_level=INFO
debug_mode=false

# Deployment settings
deploy_path=/opt/finance-app-staging
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/id_rsa

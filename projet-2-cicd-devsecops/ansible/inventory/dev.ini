# =============================================================================
# Ansible Inventory — Development Environment
# =============================================================================
# Deploys to localhost using local connection (no SSH needed)
# =============================================================================

[app_servers]
localhost ansible_connection=local

[app_servers:vars]
# Application settings
app_name=finance-app
app_image=finance-app:latest
app_port=5001
app_internal_port=5000
environment=dev
log_level=DEBUG
debug_mode=true

# Deployment settings
deploy_path=/opt/finance-app-dev
ansible_python_interpreter=/usr/bin/python3

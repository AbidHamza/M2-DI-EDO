# =============================================================================
# Ansible Inventory — Production Environment
# =============================================================================
# Replace the IP address with your actual production server
# =============================================================================

[app_servers]
prod-server-01 ansible_host=192.168.1.30 ansible_user=deploy

[app_servers:vars]
# Application settings
app_name=finance-app
app_image=finance-app:latest
app_port=5000
app_internal_port=5000
environment=production
log_level=WARNING
debug_mode=false

# Deployment settings
deploy_path=/opt/finance-app-prod
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/id_rsa

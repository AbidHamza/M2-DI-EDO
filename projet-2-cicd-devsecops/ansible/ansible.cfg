# =============================================================================
# Ansible Configuration
# =============================================================================
# Global settings for Ansible in this project.
# =============================================================================

[defaults]
# Inventory file (can be overridden with -i flag)
inventory = inventory/dev.ini

# Roles path
roles_path = roles

# Disable host key checking for dev/CI (enable in production)
host_key_checking = False

# Timeout for SSH connections
timeout = 30

# Number of parallel processes
forks = 5

# Retry files (disable to keep directory clean)
retry_files_enabled = False

# Colored output
force_color = True

# Reduce SSH connection warnings
deprecation_warnings = False

# Interpreter discovery
interpreter_python = auto_silent

[privilege_escalation]
# Use sudo by default
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# SSH connection optimizations
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no

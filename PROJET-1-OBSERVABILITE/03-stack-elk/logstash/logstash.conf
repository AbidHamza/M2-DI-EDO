input {
  # Lecture du fichier CSV généré (mode "beginning" pour relire tout, même si déjà présent)
  file {
    path => "/usr/share/logstash/pollution_data.csv"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}

filter {
  # Le bloc csv transforme chaque ligne en champs structurés
  csv {
    separator => ","
    columns => ["date", "ville", "polluant", "valeur"]
  }

  # Conversion du champ "valeur" de texte en nombre flottant
  mutate {
    convert => { "valeur" => "float" }
  }

  # Le plugin date convertit le champ "date" (format YYYY-MM-DD) en @timestamp
  date {
    match => ["date", "YYYY-MM-dd"]
    target => "@timestamp"
  }

  # Ajout dynamique d'un champ [@metadata][index_name] pour nom d'index basé sur la date
  mutate {
    add_field => { "[@metadata][index_name]" => "%{+YYYY.MM.dd}" }
  }
}

output {
  # Envoi vers Elasticsearch sur le réseau via le nom "elasticsearch"
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "pollution-%{[@metadata][index_name]}"
  }

  # Affichage en console (stdout) pour debug (codec rubydebug affiche JSON)
  stdout { codec => rubydebug }
}

# =============================================================================
# Ansible Inventory
# =============================================================================
# Defines the target machines where the observability stack will be deployed.
#
# For this project, we run everything locally. In production, you would
# list remote servers with their IP addresses or hostnames.
# =============================================================================

[observability]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3


# =============================================================================
# Ansible Role: Observability - Tasks
# =============================================================================
# This role handles the deployment of the complete observability stack.
# Tasks are idempotent: running them multiple times produces the same result.
# =============================================================================

---
# ---------------------------------------------------------------------------
# 1. Prerequisites: Verify Docker is installed
# ---------------------------------------------------------------------------

- name: Check if Docker is installed
  command: docker --version
  register: docker_version
  changed_when: false
  failed_when: docker_version.rc != 0
  tags: [prerequisites]

- name: Display Docker version
  debug:
    msg: "Docker version: {{ docker_version.stdout }}"
  tags: [prerequisites]

- name: Check if Docker Compose is available
  command: docker compose version
  register: compose_version
  changed_when: false
  failed_when: compose_version.rc != 0
  tags: [prerequisites]

- name: Display Docker Compose version
  debug:
    msg: "Docker Compose version: {{ compose_version.stdout }}"
  tags: [prerequisites]

# ---------------------------------------------------------------------------
# 2. Create directory structure
# ---------------------------------------------------------------------------

- name: Create deployment directory structure
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ deploy_dir }}"
    - "{{ deploy_dir }}/app"
    - "{{ deploy_dir }}/prometheus"
    - "{{ deploy_dir }}/loki"
    - "{{ deploy_dir }}/alertmanager"
    - "{{ deploy_dir }}/grafana/provisioning/datasources"
    - "{{ deploy_dir }}/grafana/provisioning/dashboards"
    - "{{ deploy_dir }}/grafana/dashboards"
    - "{{ deploy_dir }}/docker"
  tags: [config]

# ---------------------------------------------------------------------------
# 3. Copy configuration files using Jinja2 templates
# ---------------------------------------------------------------------------

- name: Generate Prometheus configuration from template
  template:
    src: prometheus.yml.j2
    dest: "{{ deploy_dir }}/prometheus/prometheus.yml"
    mode: "0644"
  tags: [config]

- name: Generate Alertmanager configuration from template
  template:
    src: alertmanager.yml.j2
    dest: "{{ deploy_dir }}/alertmanager/alertmanager.yml"
    mode: "0644"
  tags: [config]

# ---------------------------------------------------------------------------
# 4. Copy static configuration files
# ---------------------------------------------------------------------------

- name: Copy Prometheus alert rules
  copy:
    src: "{{ project_root }}/prometheus/alert-rules.yml"
    dest: "{{ deploy_dir }}/prometheus/alert-rules.yml"
    mode: "0644"
  tags: [config]

- name: Copy Loki configuration
  copy:
    src: "{{ project_root }}/loki/loki-config.yml"
    dest: "{{ deploy_dir }}/loki/loki-config.yml"
    mode: "0644"
  tags: [config]

- name: Copy Promtail configuration
  copy:
    src: "{{ project_root }}/docker/promtail-config.yml"
    dest: "{{ deploy_dir }}/docker/promtail-config.yml"
    mode: "0644"
  tags: [config]

- name: Copy Grafana datasources provisioning
  copy:
    src: "{{ project_root }}/grafana/provisioning/datasources/datasources.yml"
    dest: "{{ deploy_dir }}/grafana/provisioning/datasources/datasources.yml"
    mode: "0644"
  tags: [config]

- name: Copy Grafana dashboards provisioning
  copy:
    src: "{{ project_root }}/grafana/provisioning/dashboards/dashboards.yml"
    dest: "{{ deploy_dir }}/grafana/provisioning/dashboards/dashboards.yml"
    mode: "0644"
  tags: [config]

- name: Copy Grafana dashboard JSON files
  copy:
    src: "{{ item }}"
    dest: "{{ deploy_dir }}/grafana/dashboards/"
    mode: "0644"
  with_fileglob:
    - "{{ project_root }}/grafana/dashboards/*.json"
  tags: [config]

# ---------------------------------------------------------------------------
# 5. Copy application files
# ---------------------------------------------------------------------------

- name: Copy application source code
  copy:
    src: "{{ project_root }}/app/"
    dest: "{{ deploy_dir }}/app/"
    mode: "0644"
  tags: [app]

# ---------------------------------------------------------------------------
# 6. Copy and adjust docker-compose.yml
# ---------------------------------------------------------------------------

- name: Copy Docker Compose file
  copy:
    src: "{{ project_root }}/docker/docker-compose.yml"
    dest: "{{ deploy_dir }}/docker/docker-compose.yml"
    mode: "0644"
  tags: [deploy]

# ---------------------------------------------------------------------------
# 7. Build and start the stack
# ---------------------------------------------------------------------------

- name: Build the Flask application image
  command: docker build -t {{ app_name }} {{ deploy_dir }}/app/
  register: build_result
  changed_when: "'Successfully built' in build_result.stdout or 'exporting to image' in build_result.stdout"
  tags: [deploy]

- name: Start the observability stack with Docker Compose
  command: docker compose -f {{ deploy_dir }}/docker/docker-compose.yml up -d
  register: compose_result
  changed_when: "'Started' in compose_result.stdout or 'Created' in compose_result.stdout"
  tags: [deploy]

- name: Display Docker Compose output
  debug:
    msg: "{{ compose_result.stdout_lines | default([]) }}"
  when: compose_result.stdout_lines is defined
  tags: [deploy]

# ---------------------------------------------------------------------------
# 8. Verify containers are running
# ---------------------------------------------------------------------------

- name: List running containers
  command: docker ps --format "table {{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}\t{{ '{{' }}.Ports{{ '}}' }}"
  register: containers_status
  changed_when: false
  tags: [verify]

- name: Display running containers
  debug:
    msg: "{{ containers_status.stdout_lines }}"
  tags: [verify]
